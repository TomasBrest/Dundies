<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dundies">
<title>Dundies</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
  :root {
    --navy: #0b2a4a;
    --accent: #ff4d5e;
    --bg: #ffffff;
    --text: #13202e;
    --muted: #6b7785;
    --line: #e6eaef;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: #000; }
  #map { position: fixed; inset: 0; background: #aad3df; }
  button { font: inherit; cursor: pointer; border: 0; }
  [hidden] { display: none !important; }

  /* Horná lišta */
  .topbar { position: fixed; top: calc(var(--safe-t) + 10px); left: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; }
  .search { flex: 1; position: relative; }
  .search input { width: 100%; height: 46px; border: 0; border-radius: 23px; padding: 0 16px 0 42px; font-size: 16px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.18); outline: none; }
  .search::before { content: "🔍"; position: absolute; left: 15px; top: 13px; font-size: 16px; opacity: .6; }
  .results { position: absolute; top: 52px; left: 0; right: 0; background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.2); overflow: hidden; display: none; }
  .results.show { display: block; }
  .results div { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .results div:last-child { border-bottom: 0; }
  .round { width: 46px; height: 46px; border-radius: 23px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.18); font-size: 20px; display: grid; place-items: center; flex: none; }

  .fab { position: fixed; right: 16px; bottom: calc(var(--safe-b) + 24px); z-index: 1000; width: 64px; height: 64px; border-radius: 32px; background: var(--accent); color: #fff; font-size: 34px; line-height: 1; box-shadow: 0 6px 18px rgba(255,77,94,.45); display: grid; place-items: center; }
  .locate { position: fixed; right: 25px; bottom: calc(var(--safe-b) + 100px); z-index: 1000; }

  .picker { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 100px); z-index: 1001; background: var(--navy); color: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.3); display: none; }
  .picker.show { display: block; }
  .picker p { margin: 0 0 10px; font-size: 15px; }
  .picker .row { display: flex; gap: 8px; }
  .picker button { flex: 1; height: 40px; border-radius: 10px; background: rgba(255,255,255,.15); color: #fff; font-size: 15px; }
  .picker button.primary { background: var(--accent); }
  body.picking #map { cursor: crosshair; }
  body.picking .fab, body.picking .locate { display: none; }

  /* Značky */
  .pin-wrap { background: none; border: 0; }
  .pin { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; background: var(--accent) center/cover no-repeat; box-shadow: 0 3px 10px rgba(0,0,0,.35); display: grid; place-items: center; font-size: 20px; position: relative; }
  .pin::after { content: ""; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); border: 7px solid transparent; border-top: 8px solid #fff; border-bottom: 0; }
  .pol { width: 64px; background: #fff; padding: 4px 4px 0; border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.35); transform: rotate(-4deg); position: relative; }
  .pol .ph { width: 56px; height: 56px; border-radius: 2px; background: #ddd center/cover no-repeat; }
  .pol .cap { font-size: 9px; font-weight: 600; color: #333; text-align: center; padding: 3px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pol::after { content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%) rotate(4deg); border: 7px solid transparent; border-top: 9px solid #fff; border-bottom: 0; }
  .tear { width: 36px; height: 48px; }
  .tear svg { display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .stack { position: relative; width: 70px; height: 70px; }
  .stack .pol { position: absolute; left: 3px; top: 3px; padding-bottom: 4px; }
  .stack .pol::after { display: none; }
  .stack .pol.back { transform: rotate(7deg); left: 8px; top: 0; }
  .stack .pol.back .ph { background: #e9edf1; }
  .badge { position: absolute; top: -6px; right: -4px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .cl { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
  .cl.wish { background: #2b7fff; }
  .seg { display: flex; background: #eef1f4; border-radius: 12px; padding: 4px; gap: 4px; margin: 4px 0 6px; }
  .seg button { flex: 1; height: 40px; border-radius: 9px; background: none; font-size: 15px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .styleBtn { position: fixed; right: 25px; bottom: calc(var(--safe-b) + 156px); z-index: 1000; }
  body.picking .styleBtn { display: none; }
  .me { width: 18px; height: 18px; border-radius: 50%; background: #2b8cff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(43,140,255,.25); }

  /* Panely */
  .backdrop { position: fixed; inset: 0; z-index: 1999; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000; background: var(--bg); border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 18px calc(var(--safe-b) + 20px); transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -4px 30px rgba(0,0,0,.2); }
  .sheet.show { transform: translateY(0); }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: #d5dbe2; margin: 4px auto 12px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  input[type=text], input[type=email], input[type=password], input[type=date], textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #f6f8fa; outline: none; color: var(--text); }
  input[type=date] { -webkit-appearance: none; min-height: 48px; }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus { border-color: #9cc4ec; background: #fff; }
  .btn { display: block; width: 100%; height: 50px; border-radius: 14px; font-size: 16px; font-weight: 600; margin-top: 12px; background: #eef1f4; color: var(--text); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { background: #fff0f1; color: #d22a3c; }
  .btn:disabled { opacity: .5; }
  .btns { display: flex; gap: 10px; }
  .btns .btn { flex: 1; }
  .link { display: block; margin: 14px auto 0; background: none; color: var(--muted); font-size: 15px; text-decoration: underline; }
  .err { color: #d22a3c; font-size: 14px; min-height: 1em; margin: 10px 0 0; }
  .err.ok { color: #1f8a4c; }

  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; background: #eef1f4 center/cover no-repeat; overflow: hidden; }
  .thumb .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 13px; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; display: grid; place-items: center; }
  .addphoto { aspect-ratio: 1; border-radius: 10px; border: 2px dashed #c9d2dc; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; background: #fafbfc; }
  .addphoto b { display: block; font-size: 28px; font-weight: 400; }
  .note { white-space: pre-wrap; line-height: 1.5; margin: 0 0 14px; }

  .list-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list-item .t { width: 56px; height: 56px; border-radius: 12px; background: #eef1f4 center/cover no-repeat; flex: none; display: grid; place-items: center; font-size: 22px; }
  .list-item b { display: block; font-size: 16px; }
  .list-item span { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  .codebox { display: flex; align-items: center; gap: 10px; background: #f6f8fa; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 6px 0 10px; }
  .codebox div { flex: 1; font-size: 13px; color: var(--muted); }
  .codebox b { display: block; font-size: 22px; color: var(--text); letter-spacing: .06em; }
  .codebox button { background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; }

  /* Úvodné obrazovky */
  .screen { position: fixed; inset: 0; z-index: 5000; background: #000 url(icons/icon-1024.png) center calc(var(--safe-t) + 10px) / min(100vw, 460px) no-repeat; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 12px calc(var(--safe-b) + 12px); overflow-y: auto; }
  .card { background: #fff; border-radius: 22px; padding: 22px 18px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .mapchoice { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; background: #f6f8fa; margin-top: 8px; font-size: 16px; }
  .mapchoice span { color: var(--muted); font-size: 13px; }

  .lightbox { position: fixed; inset: 0; z-index: 3000; background: #000; display: none; align-items: center; justify-content: center; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox .close { position: absolute; top: calc(var(--safe-t) + 12px); right: 12px; background: rgba(255,255,255,.2); color: #fff; }
  .lightbox .count { position: absolute; bottom: calc(var(--safe-b) + 16px); color: #fff; opacity: .7; font-size: 14px; }

  .toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 70px); transform: translateX(-50%); z-index: 6000; background: rgba(19,32,46,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .leaflet-control-attribution { font-size: 9px !important; }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="search">
    <input id="q" type="search" placeholder="Hľadať miesto…" autocomplete="off" enterkeyhint="search">
    <div id="results" class="results"></div>
  </div>
  <button class="round" id="btnList" aria-label="Zoznam">📖</button>
  <button class="round" id="btnMenu" aria-label="Menu">👥</button>
</div>

<button class="round styleBtn" id="btnStyle" aria-label="Vzhľad mapy">🛰</button>
<button class="round locate" id="btnLocate" aria-label="Moja poloha">🎯</button>
<button class="fab" id="btnAdd" aria-label="Pridať">+</button>

<div class="picker" id="picker">
  <p>Ťukni na mapu, kde ste boli 📍</p>
  <div class="row">
    <button id="pickHere" class="primary">Som tu teraz</button>
    <button id="pickCancel">Zrušiť</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<!-- Formulár -->
<div class="sheet" id="formSheet">
  <div class="grip"></div>
  <h2 id="formTitle">Nový Dundie 🏆</h2>
  <p class="sub" id="formLoc"></p>
  <div class="seg" id="fKind">
    <button data-k="visited">🏆 Boli sme tu</button>
    <button data-k="wish">💙 Chceme ísť</button>
  </div>
  <label for="fName">Miesto</label>
  <input id="fName" type="text" placeholder="napr. Dubrovník">
  <div id="fDateRow">
    <label for="fDate">Dátum</label>
    <input id="fDate" type="date">
  </div>
  <label for="fNote">Poznámka</label>
  <textarea id="fNote" placeholder="Čo sme tam zažili…"></textarea>
  <label>Fotky</label>
  <div class="thumbs" id="fThumbs"></div>
  <input id="fFiles" type="file" accept="image/*" multiple hidden>
  <div class="btns">
    <button class="btn" id="fCancel">Zrušiť</button>
    <button class="btn primary" id="fSave">Uložiť</button>
  </div>
</div>

<!-- Detail -->
<div class="sheet" id="detailSheet">
  <div class="grip"></div>
  <h2 id="dName"></h2>
  <p class="sub" id="dDate"></p>
  <p class="note" id="dNote"></p>
  <div class="thumbs" id="dThumbs"></div>
  <button class="btn primary" id="dVisited" hidden>✅ Boli sme tu!</button>
  <div class="btns">
    <button class="btn" id="dEdit">✏️ Upraviť</button>
    <button class="btn danger" id="dDelete">🗑 Zmazať</button>
  </div>
</div>

<!-- Zoznam -->
<div class="sheet" id="listSheet">
  <div class="grip"></div>
  <h2>Naše Dundies 🏆</h2>
  <div class="seg" id="listKind">
    <button data-k="visited" class="on">🏆 Boli sme</button>
    <button data-k="wish">💙 Chceme ísť</button>
  </div>
  <p class="sub" id="listCount"></p>
  <div id="list"></div>
</div>

<!-- Menu / spoločná mapa -->
<div class="sheet" id="menuSheet">
  <div class="grip"></div>
  <h2 id="mMapName">Naša mapa</h2>
  <p class="sub" id="mMembers"></p>
  <div class="codebox">
    <div>Kód na pozvanie<b id="mCode"></b></div>
    <button id="mShare">Pozvať</button>
  </div>
  <button class="btn" id="mMigrate" hidden></button>
  <button class="btn" id="mFit">🌍 Ukázať všetky na mape</button>
  <button class="btn" id="mOther">🔁 Iná mapa / zadať kód</button>
  <button class="btn" id="mPassword">🔑 Zmeniť heslo</button>
  <button class="btn danger" id="mLogout">Odhlásiť sa</button>
  <p class="sub" id="mUser" style="text-align:center;margin-top:12px"></p>
</div>

<!-- Prihlásenie -->
<div class="screen" id="authScreen" hidden>
  <div class="card">
    <h1>Dundies 🏆</h1>
    <p class="sub" id="authSub">Prihlás sa do vašej spoločnej mapy</p>
    <div id="nameRow" hidden>
      <label for="aName">Tvoje meno</label>
      <input id="aName" type="text" placeholder="napr. Tomáš" autocomplete="given-name">
    </div>
    <label for="aEmail">E-mail</label>
    <input id="aEmail" type="email" autocomplete="email" inputmode="email" autocapitalize="off">
    <div id="passRow">
      <label for="aPass">Heslo</label>
      <input id="aPass" type="password" autocomplete="current-password" placeholder="aspoň 6 znakov">
    </div>
    <button class="btn primary" id="aGo">Prihlásiť sa</button>
    <p class="err" id="aErr"></p>
    <button class="link" id="aForgot">Zabudol si heslo?</button>
    <button class="link" id="aSwitch">Nemáš účet? Vytvor si ho</button>
  </div>
</div>

<!-- Prepojenie -->
<div class="screen" id="pairScreen" hidden>
  <div class="card">
    <h1>Ahoj, <span id="pName"></span> 👋</h1>
    <p class="sub">Vytvor spoločnú mapu, alebo sa pripoj kódom, ktorý ti poslal partner.</p>
    <div id="pMaps"></div>
    <button class="btn primary" id="pCreate">🗺 Vytvoriť novú spoločnú mapu</button>
    <label for="pCode">Kód od partnera</label>
    <input id="pCode" type="text" placeholder="napr. BEET-4821" autocapitalize="characters" autocomplete="off">
    <button class="btn" id="pJoin">🔗 Pripojiť sa</button>
    <p class="err" id="pErr"></p>
    <button class="link" id="pBack" hidden>← Späť na mapu</button>
    <button class="link" id="pLogout">Odhlásiť sa</button>
  </div>
</div>

<!-- Nové heslo -->
<div class="screen" id="pwScreen" hidden style="z-index:5001">
  <div class="card">
    <h1>Nové heslo 🔑</h1>
    <p class="sub">Zadaj nové heslo k svojmu účtu.</p>
    <label for="pwNew">Nové heslo</label>
    <input id="pwNew" type="password" autocomplete="new-password" placeholder="aspoň 6 znakov">
    <label for="pwNew2">Zopakuj heslo</label>
    <input id="pwNew2" type="password" autocomplete="new-password">
    <button class="btn primary" id="pwSave">Uložiť heslo</button>
    <p class="err" id="pwErr"></p>
    <button class="link" id="pwCancel">Zrušiť</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lbImg" alt="">
  <button class="round close" id="lbClose">✕</button>
  <div class="count" id="lbCount"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------- Supabase ---------- */
const SUPABASE_URL = 'https://xkmcohzferzcqgmcbynv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EDk2wVXCJH8wH5I_AZCUkg_aXLlXdsr';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' }
});
const BUCKET = 'photos';
const APP_URL = location.origin + location.pathname;

let me = null;        // prihlásený používateľ
let mapInfo = null;   // aktuálna spoločná mapa {id, name, code}
let memories = [];
let channel = null;
const signed = new Map(); // cesta k fotke -> URL

/* ---------- Pomocné ---------- */
const urls = new Map();
function blobUrl(b) { if (!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b); }
function photoUrl(p) { return typeof p === 'string' ? signed.get(p) : blobUrl(p); }
function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('sk-SK', { day: 'numeric', month: 'long', year: 'numeric' });
}
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}
function myName() { return (me && me.user_metadata && me.user_metadata.display_name) || (me && me.email ? me.email.split('@')[0] : ''); }
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}
function errText(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Nesprávny e-mail alebo heslo';
  if (/already registered/i.test(m)) return 'Tento e-mail už má účet – prihlás sa';
  if (/Email not confirmed/i.test(m)) return 'Najprv potvrď e-mail (pozri si schránku), potom sa prihlás';
  if (/rate limit/i.test(m)) return 'Priveľa pokusov, skús to o chvíľu (e-maily sa dajú posielať len párkrát za hodinu)';
  if (/should be different/i.test(m)) return 'Nové heslo musí byť iné ako staré';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Nie si pripojený na internet';
  return m;
}
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Fotku sa nepodarilo načítať')); };
    img.src = u;
  });
}
async function shrink(file, max = 1600, q = 0.82) {
  const img = await loadImg(file);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', q));
}

/* ---------- Staré spomienky z telefónu (na presun do cloudu) ---------- */
function localAll() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('spomienky', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('memories', { keyPath: 'id' });
      r.onsuccess = () => {
        try {
          const q = r.result.transaction('memories').objectStore('memories').getAll();
          q.onsuccess = () => res(q.result || []); q.onerror = () => res([]);
        } catch (_) { res([]); }
      };
      r.onerror = () => res([]);
    } catch (_) { res([]); }
  });
}

function makeStreets() {

function teardrop(color) {
  return `<div class="tear"><svg viewBox="0 0 36 48" width="36" height="48"><path d="M18 46C18 46 3 28 3 17.5A15 15 0 0 1 33 17.5C33 28 18 46 18 46Z" fill="${color}" stroke="#fff" stroke-width="3"/><circle cx="18" cy="17.5" r="6" fill="#fff"/></svg></div>`;
}
function iconFor(m) {
  if (m.kind === 'wish') return L.divIcon({ html: teardrop('#2b7fff'), className: 'pin-wrap', iconSize: [36, 48], iconAnchor: [18, 46] });

      k++; save.textContent = `Nahrávam fotky ${k}/${fresh.length}…`;
      const path = `${mapInfo.id}/${id}/${uuid()}.jpg`;
      const { error } = await sb.storage.from(BUCKET).upload(path, p, { contentType: 'image/jpeg' });
      if (error) throw error;
      signed.set(path, blobUrl(p)); paths.push(path);
    }
    save.textContent = 'Ukladám…';
    const row = {
      id, map_id: mapInfo.id,
      name: $('#fName').value.trim() || 'Bez názvu',
      kind: d.kind === 'wish' ? 'wish' : 'visited',
      date: d.kind === 'wish' ? null : ($('#fDate').value || today()),
      note: $('#fNote').value.trim(),
      lat: d.lat, lng: d.lng, photos: paths,
      updated_at: new Date().toISOString()
    };
    if (!d.id) row.author_name = myName();
    const { data, error } = await sb.from('memories').upsert(row).select().single();
    if (error) throw error;
    const removed = (d.origPhotos || []).filter(p => typeof p === 'string' && !paths.includes(p));
    if (removed.length) sb.storage.from(BUCKET).remove(removed);
    const i = memories.findIndex(x => x.id === data.id);
    if (i >= 0) memories[i] = data; else memories.push(data);
    draft = null; render(); closeSheet();
    toast(d.kind === 'wish' ? 'Pridané do „Kam chceme ísť“ 💙' : 'A Dundie ide do… tohto miesta! 🏆');
  } catch (e) { toast('Nepodarilo sa uložiť: ' + errText(e), 4000); }
  finally { save.disabled = false; save.textContent = 'Uložiť'; }
};

/* ---------- Detail ---------- */
let current = null;
function openDetail(m) {
  current = m;
  $('#dName').textContent = m.name || 'Bez názvu';
  const wish = m.kind === 'wish';
  $('#dDate').textContent = [wish ? '💙 Chceme ísť' : fmtDate(m.date), m.author_name ? `pridal(a) ${m.author_name}` : ''].filter(Boolean).join(' · ');
  $('#dVisited').hidden = !wish;
  $('#dNote').textContent = m.note || '';
  $('#dNote').style.display = m.note ? '' : 'none';
  const box = $('#dThumbs'); box.innerHTML = '';
  const list = (m.photos || []).map(photoUrl).filter(Boolean);
  list.forEach((u, i) => {
    const t = document.createElement('button'); t.className = 'thumb'; t.style.backgroundImage = `url('${u}')`;
    t.onclick = () => openLightbox(list, i);
    box.appendChild(t);
  });
  openSheet('#detailSheet');
}
$('#dEdit').onclick = () => openForm(current);
$('#dVisited').onclick = () => openForm({ ...current, kind: 'visited', date: today(), becameVisited: true });
$('#dDelete').onclick = async () => {
  if (!confirm(`Naozaj zmazať „${current.name}“? Zmizne aj partnerovi.`)) return;
  const { error } = await sb.from('memories').delete().eq('id', current.id);
  if (error) return toast('Nepodarilo sa zmazať: ' + errText(error), 4000);
  if (current.photos && current.photos.length) sb.storage.from(BUCKET).remove(current.photos);
  memories = memories.filter(x => x.id !== current.id);
  render(); closeSheet(); toast('Zmazané');
};

/* ---------- Fotka na celú obrazovku ---------- */
let lb = { list: [], i: 0 };
function showLb() { $('#lbImg').src = lb.list[lb.i]; $('#lbCount').textContent = lb.list.length > 1 ? `${lb.i + 1} / ${lb.list.length}` : ''; }
function openLightbox(list, i) { lb = { list, i }; showLb(); $('#lightbox').classList.add('show'); }
$('#lbClose').onclick = e => { e.stopPropagation(); $('#lightbox').classList.remove('show'); };
$('#lightbox').onclick = e => {
  if (lb.list.length < 2) return $('#lightbox').classList.remove('show');
  lb.i = (lb.i + (e.clientX > innerWidth / 2 ? 1 : lb.list.length - 1)) % lb.list.length; showLb();
};
let sx = null;
$('#lightbox').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
$('#lightbox').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50 && lb.list.length > 1) { e.preventDefault(); lb.i = (lb.i + (dx < 0 ? 1 : lb.list.length - 1)) % lb.list.length; showLb(); }
});

/* ---------- Zoznam ---------- */
let listKind = 'visited';
document.querySelectorAll('#listKind button').forEach(b => b.onclick = () => { listKind = b.dataset.k; drawList(); });
$('#btnList').onclick = () => { drawList(); openSheet('#listSheet'); };
function drawList() {
  document.querySelectorAll('#listKind button').forEach(b => b.classList.toggle('on', b.dataset.k === listKind));
  const box = $('#list'); box.innerHTML = '';
  const items = memories.filter(m => (m.kind === 'wish') === (listKind === 'wish'));
  const sorted = listKind === 'wish'
    ? [...items].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''))
    : [...items].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const n = items.length;
  $('#listCount').textContent = n ? `${n} ${n === 1 ? 'miesto' : n < 5 ? 'miesta' : 'miest'}` : '';
  if (!n) box.innerHTML = listKind === 'wish'
    ? '<div class="empty">Zatiaľ žiadne sny.<br>Ťukni na <b>+</b>, vyber miesto a zvoľ <b>💙 Chceme ísť</b></div>'
    : '<div class="empty">Zatiaľ tu nič nie je.<br>Ťukni na <b>+</b> a pridaj prvé miesto 🌍</div>';
  for (const m of sorted) {
    const row = document.createElement('div'); row.className = 'list-item';
    const t = document.createElement('div'); t.className = 't';
    const u = m.photos && m.photos[0] && photoUrl(m.photos[0]);
    if (u) t.style.backgroundImage = `url('${u}')`; else t.textContent = m.kind === 'wish' ? '💙' : '📍';
    const txt = document.createElement('div');
    const b = document.createElement('b'); b.textContent = m.name || 'Bez názvu';
    const s = document.createElement('span');
    s.textContent = [m.kind === 'wish' ? '' : fmtDate(m.date), m.author_name, (m.photos || []).length ? `${m.photos.length} 📷` : ''].filter(Boolean).join(' · ');
    txt.append(b, s); row.append(t, txt);
    row.onclick = () => { closeSheet(); map.flyTo([m.lat, m.lng], Math.max(map.getZoom(), 10), { duration: 1.2 }); setTimeout(() => openDetail(m), 1300); };
    box.appendChild(row);
  }
}

/* ---------- Poloha ---------- */
function locate(cb) {
  if (!navigator.geolocation) return toast('Poloha nie je dostupná');
  toast('Hľadám tvoju polohu…');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (meMarker) meMarker.setLatLng(ll);
    else meMarker = L.marker(ll, { icon: L.divIcon({ html: '<div class="me"></div>', className: 'pin-wrap', iconSize: [18, 18] }), interactive: false }).addTo(map);
    map.flyTo(ll, Math.max(map.getZoom(), 13), { duration: 1 });
    cb && cb(ll);
  }, () => toast('Polohu sa nepodarilo zistiť – povoľ ju v nastaveniach'), { enableHighAccuracy: true, timeout: 15000 });
}
$('#btnLocate').onclick = () => locate();

/* ---------- Vyhľadávanie ---------- */
let searchTimer;
$('#q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 600); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); search(); $('#q').blur(); } });
async function search() {
  const q = $('#q').value.trim(), box = $('#results');
  if (q.length < 2) { box.classList.remove('show'); return; }
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=sk&q=${encodeURIComponent(q)}`);
    const list = await r.json();
    box.innerHTML = '';
    if (!list.length) box.innerHTML = '<div>Nič som nenašiel</div>';
    for (const p of list) {
      const d = document.createElement('div'); d.textContent = p.display_name;
      d.onclick = () => { box.classList.remove('show'); $('#q').value = ''; $('#q').blur(); map.flyTo([+p.lat, +p.lon], 12, { duration: 1.2 }); };
      box.appendChild(d);
    }
    box.classList.add('show');
  } catch (_) { toast('Vyhľadávanie potrebuje internet'); }
}

/* ---------- Štart ---------- */
(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return showAuth();
    me = session.user;
    if (/type=recovery/.test(location.hash)) history.replaceState(null, '', APP_URL);
    await afterLogin();
  } catch (e) { toast(errText(e), 4000); showAuth(); }
})();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
